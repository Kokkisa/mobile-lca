<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <!-- Background fills the whole tile so iOS / Android masking doesn't
       expose a transparent edge after rounding the corners. -->
  <rect width="512" height="512" fill="#0a0a0f" />

  <!-- Glow layer: blurred, semi-transparent copy of the wordmark
       provides the halo. Drawn first so it sits underneath the sharp
       text on top. -->
  <text x="256" y="256"
        font-family="'Space Mono', 'Menlo', 'Monaco', monospace"
        font-weight="700"
        font-size="160"
        fill="#00ff88"
        text-anchor="middle"
        dominant-baseline="central"
        filter="url(#glow)"
        opacity="0.7">LCA</text>

  <!-- Sharp top layer. -->
  <text x="256" y="256"
        font-family="'Space Mono', 'Menlo', 'Monaco', monospace"
        font-weight="700"
        font-size="160"
        fill="#00ff88"
        text-anchor="middle"
        dominant-baseline="central">LCA</text>
</svg>
